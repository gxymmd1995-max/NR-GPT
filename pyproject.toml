[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nr-r15-phy"
version = "0.1.0"
description = "Traceable 3GPP NR Release 15 physical-layer simulation in Python"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy>=1.25"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
plots = ["matplotlib>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
cell = ["NRCell.md"]
diagnostics = ["ExampleLogger.md"]
grid = ["NRGrid.md", "channel_colors.md"]

srs = ["NRSRS.md"]
common = ["NRCommon.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["matlab: independently generated MATLAB 5G Toolbox reference checks"]
