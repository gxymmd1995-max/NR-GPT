[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nr-r15-phy"
version = "0.1.0"
description = "Traceable 3GPP NR Release 15 physical-layer simulation in Python"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy>=1.25"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
plots = ["matplotlib>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
cell = ["NRCell.md"]
diagnostics = ["ExampleLogger.md", "NRPlotConfig.md", "NRStagePlotter.md"]
grid = ["NRGrid.md", "channel_colors.md"]

srs = ["NRSRS.md", "NRSRSReceiver.md"]
common = ["NRCommon.md", "NRUplinkCodebook.md", "NRPhaseRotation.md", "NROFDM.md", "NRSmallBlockCode.md", "NRPolarCode.md", "NRLDPCCode.md", "NRRMCode.md", "_coding_tables.json", "NRUCICode.md", "_low_papr_24.json"]
channel = ["NRChannel.md"]
pucch = ["NRPUCCH0.md", "NRPUCCH0Transmitter.md", "NRPUCCH0Receiver.md", "NRPUCCH1.md", "NRPUCCH1Transmitter.md", "NRPUCCH1Receiver.md", "NRPUCCH2.md", "NRPUCCH2Transmitter.md", "NRPUCCH2Receiver.md", "NRPUCCH3.md", "NRPUCCH3Transmitter.md", "NRPUCCH3Receiver.md", "NRPUCCH4.md", "NRPUCCH4Transmitter.md", "NRPUCCH4Receiver.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["matlab: independently generated MATLAB 5G Toolbox reference checks"]
